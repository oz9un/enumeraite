[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enumeraite"
dynamic = ["version"]
description = "Target-specific, AI-assisted web attack-surface enumeration"
authors = [{name = "Özgün Kültekin", email = "ozgun@enumeraite.com"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "enumeration", "security", "ai", "pentesting", "bug-bounty",
    "subdomain-enumeration", "path-discovery", "attack-surface",
    "reconnaissance", "cybersecurity"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP",
    "Operating System :: OS Independent",
]

# Core dependencies
dependencies = [
    "click>=8.3.3",
    "pydantic>=2.4.0",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "PyYAML>=6.0.0",
    "dnspython>=2.6.1",
    "tldextract>=5.3.0",
    "anthropic>=0.40.0",
    "openai>=1.55.3",
]

[project.urls]
"Homepage" = "https://enumeraite.com"
"Documentation" = "https://enumeraite.com"
"Repository" = "https://github.com/oz9un/enumeraite"
"Bug Reports" = "https://github.com/oz9un/enumeraite/issues"
"Funding" = "https://github.com/sponsors/oz9un"

[project.optional-dependencies]
# Local AI models (heavy download, experimental quality)
huggingface = [
    "transformers>=5.10.1",
    "torch>=2.13.0",
    "accelerate>=0.26.0",
]

# All providers (including heavy local models)
all = [
    "transformers>=5.10.1",
    "torch>=2.13.0",
    "accelerate>=0.26.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.11.0",
    "mypy>=1.5.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
]

[project.scripts]
enumeraite = "enumeraite.cli.main:cli"

[tool.setuptools.dynamic]
version = {attr = "enumeraite.__version__"}

[tool.setuptools.package-data]
enumeraite = ["py.typed", "web/assets/*.html", "web/assets/*.js", "web/assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.report]
fail_under = 75
skip_covered = true

[tool.black]
target-version = ["py310"]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint]
select = ["F", "E9", "B018", "B905"]
