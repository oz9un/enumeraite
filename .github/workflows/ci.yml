name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' build twine
      - run: python -m black --check src tests
      - run: python -m isort --check-only src tests
      - run: python -m ruff check src tests
      - run: python -m mypy src/enumeraite
      - run: python -m pytest --cov=enumeraite --cov-report=term-missing --cov-fail-under=75
      - run: python -m build
      - run: python -m twine check dist/*

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install -e '.[dev]'
          'click==8.3.3' 'pydantic==2.4.0' 'requests==2.33.0'
          'urllib3==2.7.0' 'PyYAML==6.0.0' 'dnspython==2.6.1' 'tldextract==5.3.0'
          'openai==1.55.3' 'anthropic==0.40.0' 'httpx==0.28.1'
      - run: python -m pytest -q
      - run: python -m pip check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . bandit pip-audit
      - run: python -m bandit -q -r src/enumeraite
      - run: python -m pip_audit -r requirements.txt
